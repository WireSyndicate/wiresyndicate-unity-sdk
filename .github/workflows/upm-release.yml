name: UPM Receiver Workflow (Unity SDK Sync)

on:
  repository_dispatch:
    types: [sdk_release, api_contract_update]

jobs:
  generate_and_release:
    name: Generate C# Models and Release UPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: contains(github.event.client_payload.target_engines, 'unity')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync C# Contracts from Payload
        run: |
          echo "Target Version: ${{ github.event.client_payload.version }}"
          if [ -n "${{ github.event.client_payload.contracts_cs_base64 }}" ]; then
            echo "Updating Runtime/Contracts.cs from base64 payload..."
            echo "${{ github.event.client_payload.contracts_cs_base64 }}" | base64 -d > Runtime/Contracts.cs
          fi
          
      - name: Update UPM package.json Version
        run: |
          NEW_VERSION="${{ github.event.client_payload.version }}"
          if [ -n "$NEW_VERSION" ]; then
            jq ".version = \"$NEW_VERSION\"" package.json > package.tmp.json && mv package.tmp.json package.json
          fi
          
      - name: Commit and Tag Release
        run: |
          NEW_VERSION="${{ github.event.client_payload.version }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add package.json
          if [ -f Runtime/Contracts.cs ]; then
            git add Runtime/Contracts.cs
          fi
          if [ -f Runtime/Contracts.cs.meta ]; then
            git add Runtime/Contracts.cs.meta
          fi
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump UPM package to v$NEW_VERSION [skip ci]"
            git push origin main
          else
            echo "Working tree clean, no version change to commit."
          fi
          
          if [ -n "$NEW_VERSION" ]; then
            git tag -f "v$NEW_VERSION"
            git push origin "v$NEW_VERSION" --force
          fi
